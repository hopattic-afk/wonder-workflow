<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 384" role="img" aria-labelledby="title">
  <title id="title">Stage Moving  -  Office, Crew, Owner on one clear path</title>
  <desc>Full composition for scroll beat 03. Industry-neutral primary roles.</desc>
  <rect width="480" height="384" fill="#FAFAF8"/>
  <rect x="24" y="24" width="432" height="336" rx="4" fill="#FFFFFF" stroke="rgba(32,35,43,0.12)" stroke-width="1.5"/>
  <!-- path ground -->
  <line x1="56" y1="280" x2="424" y2="280" stroke="rgba(32,35,43,0.12)" stroke-width="1.5"/>
  <!-- steps-left on path -->
  <g fill="#7BA1AF">
    <rect x="72" y="252" width="28" height="28"/>
    <rect x="110" y="232" width="28" height="28"/>
    <rect x="148" y="212" width="28" height="28"/>
  </g>
  <line x1="176" y1="226" x2="400" y2="226" stroke="#7BA1AF" stroke-width="3"/>
  <rect x="400" y="220" width="12" height="12" fill="#7BA1AF"/>
  <!-- tiles settled along path -->
  <g>
    <rect x="56" y="88" width="100" height="72" rx="3" fill="#FFFFFF" stroke="rgba(32,35,43,0.12)" stroke-width="1.5"/>
    <rect x="68" y="102" width="24" height="24" fill="#20232B"/>
    <rect x="72" y="106" width="6" height="6" fill="#FAFAF8"/>
    <rect x="82" y="106" width="6" height="6" fill="#FAFAF8"/>
    <rect x="72" y="116" width="16" height="6" fill="#FAFAF8" opacity="0.85"/>
    <rect x="102" y="106" width="40" height="6" rx="1" fill="#20232B" opacity="0.85"/>
    <rect x="102" y="118" width="28" height="5" rx="1" fill="rgba(32,35,43,0.62)"/>
    <text x="68" y="148" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="rgba(32,35,43,0.62)" letter-spacing="0.06em">OFFICE</text>
  </g>
  <g>
    <rect x="190" y="88" width="100" height="72" rx="3" fill="#FFFFFF" stroke="rgba(32,35,43,0.12)" stroke-width="1.5"/>
    <rect x="202" y="102" width="24" height="24" fill="#20232B"/>
    <rect x="205" y="108" width="7" height="14" fill="#FAFAF8" opacity="0.9"/>
    <rect x="216" y="108" width="7" height="14" fill="#FAFAF8" opacity="0.75"/>
    <rect x="236" y="106" width="40" height="6" rx="1" fill="#20232B" opacity="0.85"/>
    <rect x="236" y="118" width="28" height="5" rx="1" fill="rgba(32,35,43,0.62)"/>
    <text x="202" y="148" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="rgba(32,35,43,0.62)" letter-spacing="0.06em">CREW</text>
    <rect x="268" y="98" width="10" height="10" fill="#7BA1AF"/>
  </g>
  <g>
    <rect x="324" y="88" width="100" height="72" rx="3" fill="#FFFFFF" stroke="rgba(32,35,43,0.12)" stroke-width="1.5"/>
    <rect x="336" y="102" width="24" height="24" fill="#20232B"/>
    <rect x="352" y="102" width="8" height="8" fill="#7BA1AF"/>
    <rect x="370" y="106" width="40" height="6" rx="1" fill="#20232B" opacity="0.85"/>
    <rect x="370" y="118" width="28" height="5" rx="1" fill="rgba(32,35,43,0.62)"/>
    <text x="336" y="148" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="rgba(32,35,43,0.62)" letter-spacing="0.06em">OWNER</text>
  </g>
  <!-- soft drop lines to path -->
  <line x1="106" y1="160" x2="106" y2="252" stroke="rgba(32,35,43,0.12)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="240" y1="160" x2="162" y2="232" stroke="rgba(32,35,43,0.12)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="374" y1="160" x2="374" y2="226" stroke="rgba(32,35,43,0.12)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="40" y="348" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#7BA1AF" letter-spacing="0.12em">BEAT 03 · MOVING</text>
</svg>
