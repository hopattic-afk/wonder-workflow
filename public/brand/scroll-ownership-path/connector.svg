<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" role="img" aria-labelledby="title">
  <title id="title">Connector  -  inactive (muted) and active (accent)</title>
  <desc>Use #inactive or #active layer. Flat square joint, logo-family.</desc>
  <!-- inactive -->
  <g id="inactive">
    <line x1="8" y1="12" x2="152" y2="12" stroke="rgba(32,35,43,0.62)" stroke-width="2" stroke-linecap="square"/>
    <rect x="74" y="8" width="8" height="8" fill="rgba(32,35,43,0.62)"/>
  </g>
  <!-- active -->
  <g id="active" transform="translate(0,16)">
    <line x1="8" y1="12" x2="152" y2="12" stroke="#7BA1AF" stroke-width="2.5" stroke-linecap="square"/>
    <rect x="72" y="6" width="12" height="12" fill="#7BA1AF"/>
  </g>

</svg>
