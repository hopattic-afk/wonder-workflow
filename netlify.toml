[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
[context.production.environment]
  WW_CRM_SYNC_ENABLED = "true"
  WW_CRM_FIRST_ASSESSMENT_FIELD_ID = "DVSkC38kqSDaATaoxUZ9"
  WW_CRM_LATEST_ASSESSMENT_FIELD_ID = "C18h3CIbr4s073Ocx4PN"
  WW_CRM_FIELDS_VERIFIED = "true"
  WW_CRM_ASSESSMENT_TAG_ENABLED = "false"
  WW_CRM_TAG_WORKFLOWS_REVIEWED = "false"
  WW_PUBLIC_RESEARCH_ENABLED = "false"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://api.leadconnectorhq.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
