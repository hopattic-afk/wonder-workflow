[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[redirects]]
  from = "/pricing"
  to = "/services"
  status = 301
[[redirects]]
  from = "/.well-known/llms.txt"
  to = "/llms.txt"
  status = 200
[[redirects]]
  from = "/.well-known/*"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/ads.txt"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/ai.txt"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/humans.txt"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/security.txt"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/sellers.json"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-S6VFyrkYcYhmxyZcBAKwFe2R/t/HAX2QnaqEfcU97FQ=' https://widgets.leadconnectorhq.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://widgets.leadconnectorhq.com https://api.leadconnectorhq.com https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://widgets.leadconnectorhq.com https://api.leadconnectorhq.com https://services.leadconnectorhq.com https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://*.analytics.google.com; frame-src https://widgets.leadconnectorhq.com https://api.leadconnectorhq.com https://api.wonderworkflow.com https://services.leadconnectorhq.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
